name: Build Windows Executable

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Release Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Cache Nuitka downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\Nuitka\Nuitka\Cache
          key: ${{ runner.os }}-nuitka-cache
          restore-keys: |
            ${{ runner.os }}-nuitka-cache

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Install Nuitka
        run: pip install nuitka

      - name: Compile CLI to Windows EXE
        run: python -m nuitka --standalone --assume-yes-for-downloads --output-dir=build main.py

      - name: Create zip archive of standalone build
        run: Compress-Archive -Path build\main.dist\* -DestinationPath bbcli.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          draft: false
          prerelease: false
          files: bbcli.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
